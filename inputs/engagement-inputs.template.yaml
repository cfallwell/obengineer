# obengineer — engagement inputs
#
# One file per engagement. Every run reads it, so each answer is given once and
# the prompts stay short. Copy it next to your deliverables and fill it in:
#
#     cp obengineer/inputs/engagement-inputs.template.yaml \
#        docs/observability/engagement-inputs.yaml
#
# Unknown is a legitimate answer. Write `unknown` and the run records the gap in
# "Open items" rather than inventing a value. What is NOT acceptable is deleting
# a key: an absent key looks like an oversight, `unknown` looks like a decision.
#
# NEVER put a token, password, or API key in this file. It records whether a
# credential exists and who holds it, never its value.

schema_version: 1

engagement:
  application: ""              # the identifier used in every filename and heading
  customer: ""
  scope: ""                    # e.g. "web storefront and checkout backends"
  date: ""                     # YYYY-MM-DD, the date on the deliverable
  document_version: 1

# ---------------------------------------------------------------------------
# Artifacts the human supplies. Paths relative to the workspace root.
# ---------------------------------------------------------------------------
artifacts:
  diagrams: []                 # C4, sequence, MFE map, account/VPC — paths or "attached in chat"
  narrative: ""                # path to an architecture write-up, if one exists
  prior_contract: ""           # an existing analysis document to extend, not replace
  prior_schema: ""             # an existing attribute-schema.json — reuse its key names
  house_style_docx: ""         # an approved .docx whose layout the output must match
  front_end_scan_notes: ""     # path, or "no browser", or "" to scan live

# ---------------------------------------------------------------------------
# Front-end surfaces to deep-scan. Omit or empty if there is no browser.
# ---------------------------------------------------------------------------
surfaces:
  production_urls: []
  non_production_urls: []
  host_and_remotes: ""         # which bundle owns provider boot, which are remotes
  edge_cdn: ""
  test_account:
    available: false
    held_by: ""                # who to ask. Never the credential itself.
    rotates_after_run: false

# ---------------------------------------------------------------------------
# Backends, from the diagrams or from the team.
# ---------------------------------------------------------------------------
backends:
  languages: []                # ["node", "java", "python", "go", "dotnet"]
  deploy_targets: []           # ["eks", "ecs", "lambda", "vm", "on-prem"]
  buses: []                    # ["kafka", "sqs", "sns", "eventbridge", "rabbitmq"]
  cloud_accounts: []           # account/subscription boundaries a trace crosses
  gateway: ""                  # what terminates TLS and may strip headers

# ---------------------------------------------------------------------------
# Splunk tenancy. Identifiers only — no tokens.
# ---------------------------------------------------------------------------
tenancy:
  o11y_realm: ""               # e.g. us1
  o11y_org_id: ""
  environments: []             # the deployment.environment values that exist today
  splunk_platform_host: ""
  thousandeyes_account_group: ""
  tokens_held_by: ""           # who can issue an ingest token when Phase 0 starts

# ---------------------------------------------------------------------------
# Entitlement. Reference, not a ceiling on what may be recommended.
#
# Supplied, these numbers let the run price its own recommendations: every tag
# promoted to a metric dimension multiplies metric time series, and MTS is what
# the contract is billed and throttled on. The projected cost and any overage go
# into a SEPARATE document for the account team — see
# references/entitlement-exposure.md — and the recommendations themselves are
# not trimmed to fit. A customer deciding to buy more is as valid an outcome as
# a customer deciding to promote fewer dimensions, and that is their decision to
# make with a number in front of them.
#
# Left `unknown`, the run recommends what the application needs and says the
# budget was not supplied. It does not guess at a limit and design around it.
#
# Set `fit_to_entitlement: true` only when the customer has ASKED for the
# recommendation to fit inside what they already own. Then it becomes a
# constraint, the run cuts to fit, and it records what it cut and what that
# costs in observability terms.
# ---------------------------------------------------------------------------
entitlement:
  fit_to_entitlement: false          # true only on explicit customer request

  observability_cloud:
    custom_mts_included: unknown       # licensed custom metric time series
    custom_mts_in_use: unknown         # current consumption, from Org Metrics
    hosts_licensed: unknown
    containers_licensed: unknown
    traces_per_minute: unknown         # APM TAPM entitlement
    mms_slots_remaining: unknown       # Monitoring MetricSets are a bounded resource
    tms_cardinality_ceiling: unknown   # per-tag ceiling agreed for Troubleshooting MetricSets
  rum:
    entitled: unknown
    sessions_per_month: unknown
    session_replay_entitled: unknown
    session_replay_accepted_in_writing: false   # cost and Core Web Vitals risk, in writing
  synthetics:
    entitled: unknown
    browser_runs_per_month: unknown
    uptime_runs_per_month: unknown
    private_locations: []
  splunk_platform:
    entitled: unknown
    ingest_gb_per_day: unknown
    retention_days: unknown
    log_observer_connect_entitled: unknown
  thousandeyes:
    entitled: unknown
    cloud_agent_units: unknown
    enterprise_agents: unknown
    test_slots_available: unknown

# ---------------------------------------------------------------------------
# Standards the deliverable must follow.
# ---------------------------------------------------------------------------
standards:
  percentile: p90              # one percentile, used in every chart and detector
  workflow_naming: "{surface}.{object}.{verb}"
  baggage_header_budget_bytes: 512     # see references/baggage-budget.md
  baggage_value_ceiling_bytes: 64
  unknown_dimension_threshold_pct: 1   # tolerated UNKNOWN bucket when grouping by a tenant key

# ---------------------------------------------------------------------------
# Constraints that veto otherwise-correct recommendations.
# ---------------------------------------------------------------------------
constraints:
  privacy_regimes: []          # ["gdpr", "ccpa", "hipaa", "pci"]
  consent_platform: ""         # what gates the agent before it may load
  pii_deny_list_additions: []  # customer-specific keys, added to the standard deny list
  competing_eum_agents: []     # other RUM/EUM agents observed on the page
  data_residency: ""           # regions telemetry may not leave
  change_windows: ""           # freeze periods that shape the phase plan
  who_deploys_front_end: ""    # the team that must agree before Phase 0 can start
  who_deploys_collector: ""

# ---------------------------------------------------------------------------
# What the human wants out of this engagement, in their words. Used to rank
# journeys when the evidence offers several equally instrumentable candidates.
# ---------------------------------------------------------------------------
outcomes:
  first_journey: ""            # leave blank to have the run rank candidates and propose one
  known_pain: []               # incidents that prompted the engagement
  audiences: ["sre", "engineer", "executive"]

# ---------------------------------------------------------------------------
# Business context, in the customer's words and numbers.
#
# This is the input to the deliverable's Business Value Realization section.
# Without it that section can still be written, but only from public evidence
# and measured performance — it cannot say what an hour of downtime costs this
# business, because nobody outside it knows.
#
# Prose is welcome. A paragraph of commentary from the person who lives with the
# problem is worth more than a number with no story attached, and the run quotes
# it rather than paraphrasing it away.
#
# Every number here is `unknown` until the customer says it. None is inferred
# from industry benchmarks: a benchmark in a customer document is a guess with a
# citation, and the first executive to recognise it stops trusting the rest.
# ---------------------------------------------------------------------------
business_context:
  commentary: ""               # free text: what hurts, in their words. Quoted, not paraphrased.
  incident_experience:
    mttd_minutes: unknown      # detect: outage starts -> somebody knows
    mtta_minutes: unknown      # acknowledge: knows -> owner engaged
    mttr_minutes: unknown      # restore: owner engaged -> customers served again
    mtti_minutes: unknown      # identify/isolate, where they track it separately
    incidents_per_month: unknown
    sev1_per_quarter: unknown
    responders_per_incident: unknown     # how many people join a bridge
    war_room_hours_per_month: unknown
    pct_incidents_found_by_customers: unknown   # the number executives react to
  operating_cost:
    observability_tools_in_use: []       # every tool paid for, including the overlaps
    annual_tooling_spend: unknown        # all of them, not just Splunk
    duplicate_agents_on_page: unknown    # from the scan, but record what they believe
    engineering_hours_per_month_on_triage: unknown
    fully_loaded_hourly_cost: unknown    # what an engineering hour costs this business
    opex_challenges: ""                  # prose: contract pressure, headcount, audit burden
  revenue_context:
    revenue_per_hour_online: unknown     # or per day; say which
    orders_per_day: unknown
    average_order_value: unknown
    conversion_rate_pct: unknown
    cart_abandonment_pct: unknown
    peak_events: []                      # named sales events and their dates
    revenue_challenges: ""               # prose: where they are losing, and to what
  business_information:
    business_model: ""                   # how money actually reaches this company
    seasonality: ""
    growth_or_margin_pressure: ""
    regulatory_exposure: ""
    strategic_initiatives: []            # replatform, market entry, app launch

# ---------------------------------------------------------------------------
# Public-record research. The analysis reads the last twelve months of public
# evidence — outage coverage, status-page history, customer complaints, field
# performance data — so the value case rests on something other than the
# customer's own recollection.
#
# Set `allowed: false` for an engagement where searching in the open is
# inappropriate, and the run uses only what it measured and what it was told.
# ---------------------------------------------------------------------------
public_evidence:
  allowed: true
  window_months: 12
  brand_terms: []              # names to search, including sub-brands and local sites
  status_page_urls: []         # the customer's own status or incident history pages
  exclude_domains: []          # sources the customer considers noise
  competitors: []              # optional, for field-performance comparison only
